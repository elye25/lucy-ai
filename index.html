<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lucy AI Assistant</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07111d">

<style>
* {
    box-sizing: border-box;
}

body {
    background: #07111d;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    margin: 0;
}

header {
    font-size: 38px;
    letter-spacing: 8px;
    color: #64f5e5;
    padding: 25px;
    font-weight: bold;
}

.orb {
    width: 190px;
    height: 190px;
    border: 3px solid #64f5e5;
    border-radius: 50%;
    margin: 35px auto;
    display: grid;
    place-items: center;
    font-size: 75px;
    color: #64f5e5;
    box-shadow: 0 0 35px #00ffe0;
}

#status {
    font-size: 20px;
    color: #64f5e5;
}

.panel {
    background: #112235;
    padding: 22px;
    border-radius: 18px;
    margin-top: 25px;
    text-align: left;
}

#response {
    font-size: 22px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

input {
    width: 100%;
    padding: 20px;
    margin-top: 25px;
    background: #162b40;
    color: white;
    border: 2px solid #64f5e5;
    border-radius: 12px;
    font-size: 19px;
}

button {
    width: 100%;
    padding: 20px;
    margin-top: 15px;
    background: #64f5e5;
    color: #07111d;
    border: none;
    border-radius: 14px;
    font-size: 19px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.55;
}

button:focus, input:focus {
    outline: 3px solid white;
    outline-offset: 3px;
}

footer {
    margin-top: 30px;
    color: #64f5e5;
    font-size: 14px;
}
</style>
</head>

<body>

<header>LUCY</header>

<p>YOUR PERSONAL AI ASSISTANT</p>

<div class="orb" aria-hidden="true">✧</div>

<p id="status" role="status" aria-live="polite">
SYSTEM ONLINE
</p>

<div class="panel">
<h2>LUCY'S RESPONSE</h2>

<div id="response" aria-live="polite">
Hello Elijah. I am Lucy. Ready to assist you.
</div>
</div>

<input
id="message"
type="text"
placeholder="Type your message here"
aria-label="Message to Lucy"
>

<button id="sendButton" onclick="talk()">
SEND MESSAGE
</button>

<button onclick="listen()">
TALK TO LUCY 🎙️
</button>

<button onclick="repeat()">
REPEAT RESPONSE 🔊
</button>

<footer>
LUCY AI • POWERED BY GEMINI
</footer>

<script>

const BACKEND =
"https://lucy-ai-backend.elijahkungu513.workers.dev";

let lastResponse = "Hello Elijah. I am Lucy.";

let recognition = null;

async function talk() {

    const input = document.getElementById("message");

    const message = input.value.trim();

    if (!message) {
        showStatus("PLEASE ENTER A MESSAGE");
        return;
    }

    input.value = "";

    await respond(message);
}

async function respond(message) {

    const responseBox =
        document.getElementById("response");

    const sendButton =
        document.getElementById("sendButton");

    try {

        showStatus("LUCY IS THINKING...");

        sendButton.disabled = true;

        responseBox.innerText =
            "Please wait. Lucy is preparing your answer.";

        const result = await fetch(
            BACKEND + "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await result.json();

        if (!result.ok) {
            throw new Error(
                data.error || "Connection failed."
            );
        }

        if (!data.reply) {
            throw new Error("Lucy received an empty response.");
        }

        lastResponse = data.reply;

        responseBox.innerText = data.reply;

        showStatus("LUCY IS ONLINE");

        speak(data.reply);

    } catch (error) {

        console.error(error);

        lastResponse =
            "I could not connect to my AI brain. Please check your internet connection and try again.";

        responseBox.innerText = lastResponse;

        showStatus("CONNECTION PROBLEM");

    } finally {

        sendButton.disabled = false;

    }
}

function showStatus(message) {

    document.getElementById("status").innerText =
        message;

}

function speak(text) {

    if (!window.speechSynthesis) {
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-GB";
    voice.rate = 0.9;
    voice.pitch = 1;

    speechSynthesis.speak(voice);

}

function repeat() {

    speak(lastResponse);

}

function listen() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {

        showStatus(
            "VOICE INPUT NOT SUPPORTED IN THIS BROWSER"
        );

        return;
    }

    recognition = new Recognition();

    recognition.lang = "en-GB";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.onstart = function() {

        showStatus("LISTENING TO YOU...");

    };

    recognition.onresult = function(event) {

        const spokenMessage =
            event.results[0][0].transcript;

        document.getElementById("message").value =
            spokenMessage;

        respond(spokenMessage);

    };

    recognition.onerror = function() {

        showStatus("VOICE RECOGNITION ERROR");

    };

    recognition.onend = function() {

        if (
            document.getElementById("status").innerText
            === "LISTENING TO YOU..."
        ) {
            showStatus("LUCY IS ONLINE");
        }

    };

    recognition.start();

}

document.getElementById("message")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        talk();
    }

});

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

        navigator.serviceWorker.register(
            "./service-worker.js"
        ).catch(function(error) {

            console.log(
                "Service worker registration failed:",
                error
            );

        });

    });

}

</script>

</body>
    </html>
